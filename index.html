<style>

<header class="topbar"><div class="brand-mark" aria-hidden="true">🐈</div><div class="brand-copy"><strong>MeowAbsensi</strong><small>Absensi rapi, tanpa foto yang hilang</small></div><span class="top-pill">🐾 CAT EDITION</span></header><h1>Catatan Kehadiran</h1><div id="m"></div><div class="pg" id="pg"></div><div class="card" id="v"></div>
</main>
<div class="ov" id="ld" hidden><div class="lc"><div class="ph"><img id="lp" alt=""></div><b id="lt">Menyiapkan...</b><p class="s" id="lm" style="margin:6px 0 0"></p><div class="bar"><i id="lb"></i></div><div id="lc"></div></div></div>
<div class="ov" id="vw" data-cl hidden><div class="lc"><img id="li" alt=""><div class="g2"><button class="b o" data-cl>Tutup</button><button class="b o" id="lredit">Koreksi data</button><button class="b r" id="lr">Hapus foto</button></div></div></div>
<div class="ov" id="ed" hidden><div class="lc" style="text-align:left"><div style="display:flex;align-items:center;gap:8px"><b style="font-size:18px">🐾 Koreksi data foto</b><button class="b o" style="width:auto;margin:0 0 0 auto;padding:7px 10px;min-height:34px" data-edclose>Tutup</button></div><p class="s" id="edhint" style="margin:8px 0 2px">Periksa tanggal dan waktu pada foto.</p><div id="edpreview" style="text-align:center;margin:10px 0"></div><div class="edit-grid"><div class="wide"><label>Tanggal absensi</label><input id="eddate" type="date"></div><div><label>Jam</label><input id="edtime" type="time" step="60"></div><div><label>Jenis foto</label><select id="edrole"><option value="">Belum ditentukan</option><option value="in">Jam masuk</option><option value="out">Jam keluar</option></select></div><div class="wide"><label>Shift</label><select id="edshift"><option value="">Pilih shift</option><option value="op">Opening</option><option value="mid">Middle</option><option value="cl">Closing</option><option value="full">Full Shift</option></select></div></div><p class="hint">Foto asli tetap disimpan. Koreksi manual hanya mengubah data absensi, bukan gambar.</p><button class="b" id="edsave">Simpan koreksi</button><button class="b o" data-edclose>Batal</button></div></div>
<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'],LB={hadir:'Hadir',libur:'Libur',sakit:'Sakit',izin:'Izin',none:'-'};
const SF={op:'Opening',mid:'Middle',cl:'Closing',full:'Full Shift'},SC={op:'#e87936',mid:'#9b72cf',cl:'#4f83c8',full:'#c84b68'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&(()=>{const d=new Date(s+'T12:00:00');return !isNaN(d)&&iso(d)===s})();
const validTime=s=>/^([01]\d|2[0-3]):[0-5]\d$/.test(s||'');
const stamp=(date,time)=>{if(!validDate(date)||!validTime(time))return null;const [y,m,d]=date.split('-').map(Number),[h,n]=time.split(':').map(Number);return new Date(y,m-1,d,h,n,0,0).getTime()};
let C={n:'',b:'',mo:iso(new Date()).slice(0,7),last:0,libur:[],sakit:[],izin:[],note:''},P=[],SW={},SH={},doc=null,st=0,UNASSIGNED=[],editId=null;
try{Object.assign(C,JSON.parse(localStorage.getItem('abs3')||'{}'))}catch(e){}
try{const aux=JSON.parse(localStorage.getItem('abs3_aux')||'{}');SH=aux.SH||{};SW=aux.SW||{}}catch(e){}
const save=()=>{try{localStorage.setItem('abs3',JSON.stringify(C));localStorage.setItem('abs3_aux',JSON.stringify({SH,SW}))}catch(e){msg('Penyimpanan pengaturan penuh. Foto tetap disimpan terpisah.')}};
const dim=()=>{const[Y,M]=C.mo.split('-').map(Number);return new Date(Y,M,0).getDate()};
const lastDef=()=>{const t=new Date();return C.mo===iso(t).slice(0,7)?t.getDate():dim()};
const V=h=>{$('v').innerHTML=h},msg=t=>{$('m').textContent=t};
const kind=d=>d>C.last?'none':C.libur.includes(d)?'libur':C.sakit.includes(d)?'sakit':C.izin.includes(d)?'izin':'hadir';
const hd=()=>{const a=[];for(let d=1;d<=C.last;d++)if(kind(d)==='hadir')a.push(d);return a};
const dow=d=>HR[new Date(+C.mo.slice(0,4),+C.mo.slice(5)-1,d).getDay()];
/* ---- data waktu & shift ---- */
const hasDate=p=>!!p&&validDate(p.date),complete=p=>!!p&&validDate(p.date)&&validTime(p.time);
const ok=complete,tm=p=>complete(p)?p.time:'',mn=p=>{const [h,m]=p.time.split(':').map(Number);return h*60+m};
const need=r=>!(r&&complete(r.i)&&complete(r.o));
function sug(r){if(!r||!complete(r.i))return null;const m=mn(r.i);let s=m<570?'op':m<690?'mid':'cl';if(s==='op'&&complete(r.o)){const o=mn(r.o);if(o>=1410||o<60)s='full'}return s}
const fin=(d,r)=>SH[d]||(need(r)?null:sug(r));
/* ---- IndexedDB: foto asli disimpan terpisah dari metadata ---- */
const DB_NAME='meow-absensi-db',DB_STORE='photos';let dbPromise=null;
function openDB(){if(!('indexedDB'in window))return Promise.reject(new Error('Browser tidak mendukung IndexedDB'));if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const q=indexedDB.open(DB_NAME,1);q.onupgradeneeded=()=>{const db=q.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:'id'})};q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});return dbPromise}
async function putPhoto(p){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).put({...p});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function deletePhoto(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function clearPhotos(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,'readwrite');tx.objectStore(DB_STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function restorePhotos(){try{const db=await openDB(),rows=await new Promise((resolve,reject)=>{const q=db.transaction(DB_STORE,'readonly').objectStore(DB_STORE).getAll();q.onsuccess=()=>resolve(q.result||[]);q.onerror=()=>reject(q.error)});P=rows;for(const p of P){if(!p.d&&p.blob){try{const z=await shrinkF(p.blob);p.d=z.d;p.w=z.w;p.h=z.h;await putPhoto(p)}catch(e){}}}}catch(e){msg('Penyimpanan foto lokal tidak dapat dibuka. Gunakan browser terbaru dan izinkan penyimpanan situs.')}}
const loadImg=f=>new Promise((res,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>res({i,u});i.onerror=()=>{URL.revokeObjectURL(u);no(new Error('Foto tidak dapat dibuka'))};i.src=u});
function shrink(i){const k=Math.min(1,1000/Math.max(i.width,i.height)),w=Math.max(1,Math.round(i.width*k)),h=Math.max(1,Math.round(i.height*k)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);return{d:c.toDataURL('image/jpeg',.78),w,h}}
const shrinkF=async f=>{const{i,u}=await loadImg(f);try{return shrink(i)}finally{URL.revokeObjectURL(u)}};
function badge(i){const W=300,H=Math.round(W*i.height/i.width),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(i,0,0,W,H);const a=x.getImageData(Math.round(W*.02),Math.round(H*.70),Math.round(W*.35),Math.round(H*.12)).data;let blue=0,orange=0;for(let k=0;k<a.length;k+=4){const r=a[k],g=a[k+1],b=a[k+2];if(b>150&&b>r*1.25&&b>g*1.1)blue++;if(r>190&&g>65&&g<180&&b<130)orange++}return blue>orange*1.15&&blue>80?'in':orange>blue*1.15&&orange>80?'out':null}
let TW=null,OE='',fi=0,ft=null;
const FUN=['Membaca cap waktu Marki…','Mencari tanggal dan jam…','Memeriksa format angka…','Foto tetap aman selama diproses…'];
const ld=on=>{$('ld').hidden=!on;clearInterval(ft);if(on){fi=0;$('lm').textContent=FUN[0];$('lc').innerHTML='';$('lb').style.width='0';ft=setInterval(()=>{if(TW)$('lm').textContent=FUN[++fi%FUN.length]},2200)}};
async function worker(){if(!window.Tesseract)throw new Error('OCR tidak termuat. Periksa koneksi internet.');if(!TW){$('lt').textContent='Menyiapkan pembaca OCR…';TW=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.progress!=null&&m.status!=='recognizing text')$('lm').textContent='Menyiapkan OCR '+Math.round(m.progress*100)+'%'}});await TW.setParameters({tessedit_pageseg_mode:'11',preserve_interword_spaces:'1'})}return TW}
function cropForOCR(i,x0,y0,xw,yh,maxW=1500){const sw=i.naturalWidth||i.width,sh=i.naturalHeight||i.height,sx=Math.round(sw*x0),sy=Math.round(sh*y0),cw=Math.round(sw*xw),ch=Math.round(sh*yh),scale=Math.min(2.2,maxW/cw),w=Math.max(1,Math.round(cw*scale)),h=Math.max(1,Math.round(ch*scale)),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(i,sx,sy,cw,ch,0,0,w,h);const im=g.getImageData(0,0,w,h),d=im.data;for(let q=0;q<d.length;q+=4){const v=Math.max(0,Math.min(255,(.299*d[q]+.587*d[q+1]+.114*d[q+2]-118)*1.35+128));d[q]=d[q+1]=d[q+2]=v}g.putImageData(im,0,0);return c}
const parseOCR=text=>MarkiOCR.parse(text);
async function ocr(i){try{const w=await worker(),results=[];await w.setParameters({tessedit_pageseg_mode:'11'});let r=await w.recognize(i);results.push(parseOCR(r.data.text));let best=results[0];if(best.date&&best.time&&best.timeDigits!==1)return best;
// Marki Cam has more than one overlay layout: retry the lower area without assuming a fixed separator.
const crop=cropForOCR(i,0,.43,.82,.55,1600);await w.setParameters({tessedit_pageseg_mode:'11'});r=await w.recognize(crop);results.push(parseOCR(r.data.text));best=MarkiOCR.merge(results);
if(!best.date||!best.time){const left=cropForOCR(i,0,.48,.66,.48,1500);await w.setParameters({tessedit_pageseg_mode:'6'});r=await w.recognize(left);results.push(parseOCR(r.data.text));best=MarkiOCR.merge(results)}

async function add(fs,shared){let k=0,n=0;OE='';ld(true);for(const f of fs){$('lt').textContent='Foto '+(k+1)+' dari '+fs.length;let p={id:(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)),name:f.name||'foto.jpg',blob:f,date:'',time:'',t:null,src:'manual',role:null,d:'',w:0,h:0};P.push(p);try{await putPhoto(p)}catch(e){msg('Foto masih ada di sesi ini, tetapi penyimpanan permanen browser gagal.')}try{const{i,u}=await loadImg(f);try{const z=shrink(i);Object.assign(p,z);$('lp').src=z.d;p.role=badge(i);const o=await ocr(i);p.date=o.date||'';p.time=o.time||'';p.role=o.role||p.role;p.src=complete(p)?'ocr':p.date||p.time?'partial':'manual';p.t=stamp(p.date,p.time);if(complete(p))n++;URL.revokeObjectURL(u)}catch(e){URL.revokeObjectURL(u)}}catch(e){p.src='manual'}try{await putPhoto(p)}catch(e){msg('Metadata foto gagal diperbarui. Foto asli sudah dicoba disimpan lebih dahulu.')}k++;$('lb').style.width=Math.round(k/fs.length*100)+'%';const c=$('lc');c.insertAdjacentHTML('afterbegin','<span class="chip">'+(complete(p)?'✓ '+tm(p):'🐾 perlu input')+'</span>');while(c.children.length>4)c.lastChild.remove()}
