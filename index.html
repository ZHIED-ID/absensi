<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Absensi</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<style>
:root{--bg:#f0f4f8;--card:rgba(255,255,255,0.85);--card-solid:#fff;--tx:#111827;--mu:#6b7280;--ac:#0f766e;--ac-rgb:15,118,110;--bd:#e2e8f0;--wn:#fef3c7;--wt:#92400e;--bt:#fff;--sh:0 8px 32px rgba(0,0,0,0.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#090d16;--card:rgba(23,27,34,0.8);--card-solid:#171b22;--tx:#f3f4f6;--mu:#9ca3af;--ac:#2dd4bf;--ac-rgb:45,212,191;--bd:#30363d;--wn:#3b2a0e;--wt:#fde047;--bt:#04201c;--sh:0 8px 32px rgba(0,0,0,0.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;backdrop-filter:blur(20px)}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.5px;font-weight:800}h2{font-size:20px;margin:0 0 6px;letter-spacing:-.3px;font-weight:700}
.s{color:var(--mu);margin:0 0 16px;font-size:14px}
#m{min-height:22px;font-size:13px;color:var(--ac);margin:0 0 10px;font-weight:500}
.pg{display:flex;gap:6px;margin:12px 0 20px}.pg i{flex:1;height:5px;border-radius:4px;background:var(--bd);transition:.4s}.pg i.on{background:var(--ac)}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:24px;padding:22px;box-shadow:var(--sh);animation:rise .35s cubic-bezier(0.16, 1, 0.3, 1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
label{display:block;font-size:12px;color:var(--mu);margin:14px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
input:not([type=file]),select{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--card-solid);color:var(--tx);font:inherit;outline:0;transition:.2s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(var(--ac-rgb),0.15)}input[type=file]{width:100%;font:inherit;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.b{width:100%;padding:15px;border:0;border-radius:14px;background:var(--ac);color:var(--bt);font:700 15px inherit;margin-top:16px;cursor:pointer;transition:transform .12s,opacity .2s,box-shadow .2s;box-shadow:0 4px 12px rgba(var(--ac-rgb),0.25)}
.b:active{transform:scale(.97)}.b.o{background:transparent;color:var(--tx);border:1.5px solid var(--bd);box-shadow:none}.b.r{background:#dc2626;color:#fff;box-shadow:0 4px 12px rgba(220,38,38,0.25)}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0;text-align:center}.dg small{color:var(--mu);font-size:11px;padding-bottom:2px;font-weight:600}
.dg button{aspect-ratio:1;border:0;border-radius:12px;background:var(--card-solid);border:1px solid var(--bd);color:var(--tx);font:600 14px inherit;cursor:pointer;transition:.15s}
.dg button:active{transform:scale(.9)}.dg .on{background:var(--ac);color:var(--bt);border-color:var(--ac);font-weight:700}.dg .off{opacity:.35;text-decoration:line-through}
.dz{display:block;text-align:center;border:2px dashed var(--ac);border-radius:20px;padding:30px 16px;margin:0;cursor:pointer;color:var(--mu);font-size:14px;background:rgba(var(--ac-rgb),0.02);transition:.2s}
.dz:hover,.dz:active{background:rgba(var(--ac-rgb),0.06);color:var(--tx)}.dz b{display:block;font-size:32px;color:var(--ac);margin-bottom:4px}
.pts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.pt{position:relative;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:1px solid var(--bd);animation:rise .3s both}.pt img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.pt span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,0.75);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600}.pt.bad{border:2px solid #f59e0b}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.st div{background:var(--card-solid);border:1px solid var(--bd);border-radius:14px;padding:12px 4px;text-align:center}.st b{display:block;font-size:20px;font-weight:800}.st small{color:var(--mu);font-size:11px;font-weight:600}
.bn{border-radius:14px;padding:12px 16px;margin-bottom:14px;background:var(--wn);color:var(--wt);font-weight:600;font-size:13px;border:1px solid rgba(245,158,11,0.2)}.bn.ok{background:rgba(var(--ac-rgb),0.1);color:var(--ac);border-color:rgba(var(--ac-rgb),0.2)}
.day{border-top:1px solid var(--bd);padding:14px 0;animation:rise .3s both}.day.mut{opacity:.6;padding:10px 0}
.dh{display:flex;align-items:center;gap:10px}.dn{width:46px}.dn b{font-size:20px;display:block;line-height:1;font-weight:800}.dn small{color:var(--mu);font-size:11px;font-weight:600}
.dm{margin-left:auto}.pill{display:inline-block;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c,#888) 16%,transparent);color:var(--c,var(--mu))}
.ts{display:flex;gap:12px;margin:12px 0 0 56px;align-items:flex-end}
.t{margin:0;text-align:center;font-size:11px;color:var(--mu);font-weight:600}.t img,.t .em{width:64px;height:86px;object-fit:cover;border-radius:12px;border:1px solid var(--bd);display:grid;place-items:center;background:var(--card-solid);cursor:pointer}.t.bad img{border:2px solid #f59e0b}
.sw{margin-left:auto;color:var(--ac);font-size:13px;cursor:pointer;padding:6px;font-weight:700}
.cf{margin:12px 0 0 56px;background:var(--wn);border:1px solid rgba(245,158,11,0.2);border-radius:14px;padding:12px;font-size:13px;color:var(--wt)}.cf p{margin:0 0 8px;font-weight:600}
.ch{display:flex;flex-wrap:wrap;gap:6px}.ch button{padding:8px 14px;border-radius:99px;border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:var(--card-solid);color:var(--c);font:700 13px inherit;cursor:pointer;transition:.15s}
.ch button.on{background:var(--c);color:#fff;border-color:var(--c)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lc{background:var(--card-solid);border:1px solid var(--bd);border-radius:24px;padding:20px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.3);animation:rise .25s}
.lc img{max-width:100%;max-height:45vh;border-radius:14px;object-fit:cover;border:1px solid var(--bd)}
.ph{position:relative;width:120px;height:150px;margin:0 auto 14px;border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--bd)}.ph img{width:100%;height:100%;object-fit:cover}
.ph:after{content:'';position:absolute;left:0;right:0;height:30px;background:linear-gradient(transparent,rgba(45,212,191,.7),transparent);animation:sc 1.1s ease-in-out infinite alternate}
@keyframes sc{from{top:-30px}to{top:100%}}
.bar{height:6px;border-radius:4px;background:var(--bd);overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.chip{display:inline-block;margin:3px;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);font-size:11px;font-weight:600;animation:pop .35s}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
</style></head><body><main>
<h1>Absensi</h1><div id="m"></div><div class="pg" id="pg"></div><div class="card" id="v"></div>
</main>
<div class="ov" id="ld" hidden><div class="lc"><div class="ph"><img id="lp" alt=""></div><b id="lt">Menyiapkan...</b><p class="s" id="lm" style="margin:6px 0 0"></p><div class="bar"><i id="lb"></i></div><div id="lc"></div></div></div>
<div class="ov" id="vw" data-cl hidden><div class="lc" style="text-align:left">
<div style="text-align:center;margin-bottom:12px"><img id="li" alt="" style="max-height:30vh"></div>
<label>Waktu / Jam Absen</label><input id="mt" type="datetime-local">
<label>Status Peran Foto</label><select id="mr"><option value="">Auto / Tidak Ditentukan</option><option value="in">Jam Masuk</option><option value="out">Jam Pulang</option></select>
<div class="g2" style="margin-top:16px"><button class="b o" data-cl>Tutup</button><button class="b r" id="lr">Hapus</button></div>
<button class="b" id="msv" style="margin-top:8px">Simpan Perubahan</button>
</div></div>
<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'],LB={hadir:'Hadir',libur:'Libur',sakit:'Sakit',izin:'Izin',none:'-'};
const SF={op:'Opening',mid:'Middle',cl:'Closing',full:'Full Shift'},SC={op:'#f59e0b',mid:'#8b5cf6',cl:'#3b82f6',full:'#e11d48'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let C={n:'',b:'',mo:iso(new Date()).slice(0,7),last:0,libur:[],sakit:[],izin:[],note:''},P=[],SW={},SH={},doc=null,st=0;
try{Object.assign(C,JSON.parse(localStorage.getItem('abs3')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('abs3',JSON.stringify(C))}catch(e){}};
const dim=()=>{const[Y,M]=C.mo.split('-').map(Number);return new Date(Y,M,0).getDate()};
const lastDef=()=>{const t=new Date();return C.mo===iso(t).slice(0,7)?t.getDate():dim()};
const V=h=>{$('v').innerHTML=h},msg=t=>{$('m').textContent=t};
const kind=d=>d>C.last?'none':C.libur.includes(d)?'libur':C.sakit.includes(d)?'sakit':C.izin.includes(d)?'izin':'hadir';
const hd=()=>{const a=[];for(let d=1;d<=C.last;d++)if(kind(d)==='hadir')a.push(d);return a};
const dow=d=>HR[new Date(+C.mo.slice(0,4),+C.mo.slice(5)-1,d).getDay()];
/* ---- jam & shift ---- */
const ok=p=>!!p&&p.src==='ocr';
const tm=p=>p&&p.t?pad(new Date(p.t).getHours())+':'+pad(new Date(p.t).getMinutes()):'';
const mn=p=>{const d=new Date(p.t);return d.getHours()*60+d.getMinutes()};
const need=r=>!(r&&ok(r.i)&&ok(r.o));
function sug(r){if(!r||!ok(r.i))return null;const m=mn(r.i);let s=m<570?'op':m<690?'mid':'cl';
if(s==='op'&&ok(r.o)){const o=mn(r.o);if(o>=1410||o<60)s='full'}return s}
const fin=(d,r)=>SH[d]||(need(r)?null:sug(r));
/* ---- foto & OCR ---- */
const loadImg=f=>new Promise((res,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>res({i,u});i.onerror=no;i.src=u});
function shrink(i){const k=Math.min(1,800/Math.max(i.width,i.height)),w=Math.round(i.width*k),h=Math.round(i.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);return{d:c.toDataURL('image/jpeg',.7),w,h}}
const shrinkF=async f=>{const{i,u}=await loadImg(f),r=shrink(i);URL.revokeObjectURL(u);return r};
function badge(i){const W=300,H=Math.round(W*i.height/i.width),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(i,0,0,W,H);
const a=x.getImageData(Math.round(W*.03),Math.round(H*.7),Math.round(W*.4),Math.round(H*.15)).data;let b=0,o=0;
for(let k=0;k<a.length;k+=4){const r=a[k],g=a[k+1],l=a[k+2];if(l>200&&r<120&&g<150)b++;else if(r>200&&g>60&&g<160&&l<120)o++}
return b>o&&b>100?'in':o>b&&o>100?'out':null}
let TW=null,OE='',fi=0,ft=null;
const FUN=['Mencari angka jam pada watermark…','Membaca tanggal pada foto…','Menganalisis waktu kehadiran…','Hampir selesai…'];
const ld=on=>{$('ld').hidden=!on;clearInterval(ft);if(on){fi=0;$('lm').textContent=FUN[0];$('lc').innerHTML='';$('lb').style.width='0';ft=setInterval(()=>{if(TW)$('lm').textContent=FUN[++fi%FUN.length]},2000)}};

/* Robust OCR parser supporting multiple Marki camera watermark formats */
async function ocr(i){
if(!window.Tesseract){OE='Pembaca jam tidak termuat.';return null}
try{if(!TW){$('lt').textContent='Menyiapkan pembaca OCR…';
TW=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.progress!=null&&!/recogni/.test(m.status))$('lm').textContent='Mengunduh modul: '+Math.round(m.progress*100)+'%'}});
}
const k=Math.min(1,1000/i.width),W=Math.round(i.width*k),H=Math.round(i.height*k),c=document.createElement('canvas');
c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(i,0,0,W,H);

// Crop bottom 35% where timestamps usually reside
const sx=0,sy=Math.round(H*.65),sw=W,sh=Math.round(H*.35);
const tCanvas=document.createElement('canvas');tCanvas.width=sw;tCanvas.height=sh;
tCanvas.getContext('2d').drawImage(c,sx,sy,sw,sh,0,0,sw,sh);

await TW.setParameters({tessedit_pageseg_mode:'6'});
const text=(await TW.recognize(tCanvas)).data.text;

// Parse time HH:MM and date DD-MM-YYYY or YYYY-MM-DD
const tmMatch=text.match(/(\d{1,2})\s*[:\.]\s*(\d{2})/);
const dtMatch=text.match(/(\d{2})\s*[-_\/]\s*(\d{2})\s*[-_\/]\s*(\d{4})/) || text.match(/(\d{4})\s*[-_\/]\s*(\d{2})\s*[-_\/]\s*(\d{2})/);

if(tmMatch && dtMatch){
let h=+tmMatch[1],m=+tmMatch[2];
let day,mon,yr;
if(dtMatch[3].length===4){day=+dtMatch[1];mon=+dtMatch[2];yr=+dtMatch[3]}
else{yr=+dtMatch[1];mon=+dtMatch[2];day=+dtMatch[3]}
if(h>=0&&h<24&&m>=0&&m<60&&mon>=1&&mon<=12&&day>=1&&day<=31&&yr>=2020&&yr<=2040){
return new Date(yr,mon-1,day,h,m).getTime();
}
}
}catch(e){OE='Gagal membaca OCR otomatis.'}
return null;
}

async function add(fs,sh){let k=0,n=0;OE='';ld(true);
for(const f of fs){$('lt').textContent='Memproses '+(k+1)+' dari '+fs.length;let chip='';
try{const{i,u}=await loadImg(f),z=shrink(i);$('lp').src=z.d;let t=null,src='',role=null;
try{role=badge(i)}catch(e){}
try{t=await ocr(i);if(t)src='ocr'}catch(e){}
if(!t){t=f.lastModified||Date.now();src='manual'}
URL.revokeObjectURL(u);
const p={id:Math.random().toString(36).slice(2,9),name:f.name||'',t,src,role,d:z.d,w:z.w,h:z.h};P.push(p);
if(src==='ocr'){n++;const d=new Date(t);chip='✓ '+tm(p)+' · '+d.getDate()+'/'+(d.getMonth()+1)}else chip='⚠ Atur manual'}catch(e){chip='⚠ Gagal'}
k++;$('lb').style.width=Math.round(k/fs.length*100)+'%';
const c=$('lc');c.insertAdjacentHTML('afterbegin','<span class="chip">'+chip+'</span>');while(c.children.length>4)c.lastChild.remove()}
ld(false);msg(k+' foto ditambahkan. ('+n+' terbaca otomatis, sisanya dapat diatur manual).');if(st===4)s4()}

async function got(){if(!/shared=1/.test(location.search)||!window.caches)return;
const c=await caches.open('share'),ks=await c.keys(),fs=[];
for(const k of ks){const r=await c.match(k);fs.push(new File([await r.blob()],decodeURIComponent(r.headers.get('x-name')||'foto.jpg'),{type:'image/jpeg'}));await c.delete(k)}
history.replaceState(null,'','./');if(fs.length){await add(fs,true);msg(fs.length+' foto dari galeri siap.')}}

/* ---- pasangkan foto ke hari ---- */
function assign(){const H=hd(),R={},rest=[];
P.forEach(p=>{let dt=p.t?new Date(p.t):null;
if(dt&&p.role==='out'&&dt.getHours()<6){const v=new Date(p.t-864e5);if(iso(v).slice(0,7)===C.mo)dt=v}
const d=dt&&iso(dt).slice(0,7)===C.mo?dt.getDate():0;
if(H.includes(d))(R[d]=R[d]||{a:[]}).a.push(p);else rest.push(p)});
for(const d in R){const a=R[d].a.sort((x,y)=>x.t-y.t),ins=a.filter(p=>p.role==='in'),outs=a.filter(p=>p.role==='out'),un=a.filter(p=>!p.role);
R[d]={i:ins[0]||un.shift()||null,o:outs[outs.length-1]||un.pop()||null}}
rest.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
const take=x=>{const k=rest.findIndex(p=>p.role!==x);return k<0?null:rest.splice(k,1)[0]};
H.forEach(d=>{const e=R[d]||(R[d]={i:null,o:null});if(!e.i)e.i=take('out');if(!e.o)e.o=take('in');if(SW[d])[e.i,e.o]=[e.o,e.i]});
return R}

/* ---- tampilan ---- */
const nav='<div class="g2"><button class="b o" data-bk>Kembali</button><button class="b" data-go>Lanjut</button></div>';
function s0(){V(`<h2>Data Diri</h2><p class="s">Informasi absensi dan periode.</p><label>Nama Lengkap</label><input id="n" value="${esc(C.n)}" placeholder="Nama Anda"><label>Cabang</label><input id="b" value="${esc(C.b)}" placeholder="Nama Cabang"><div class="g2"><div><label>Bulan</label><input id="mo" type="month" value="${C.mo}"></div><div><label>Sampai Tanggal</label><input id="la" type="number" min="1" max="31" value="${C.last||lastDef()}"></div></div><button class="b" data-go>Lanjut</button>`)}
function grid(){const key=['','libur','sakit','izin'][st],[Y,M]=C.mo.split('-').map(Number),off=new Date(Y,M-1,1).getDay();
let h=HR.map(x=>'<small>'+x+'</small>').join('')+'<span></span>'.repeat(off);
for(let d=1;d<=C.last;d++){const k=kind(d);h+=`<button data-d="${d}" class="${k===key?'on':k!=='hadir'?'off':''}">${d}</button>`}
$('gr').innerHTML=h}
function sx(){const t=[0,['Hari Libur','Tentukan tanggal libur Anda',''],
['Sakit','Tentukan tanggal sakit','<label>Surat Dokter (Wajib)</label><input id="dk" type="file" accept="image/*">'+(doc?'<p class="s">✓ Surat dokter tersimpan.</p>':'')],
['Izin','Keterangan Izin','<label>Alasan Izin</label><input id="kt" value="'+esc(C.note)+'" placeholder="Alasan...">']][st];
V(`<h2>${t[0]}</h2><p class="s">${t[1]} Ketuk tanggal pada kalender di bawah.</p><div class="dg" id="gr"></div>${t[2]}${nav}`);grid()}
function s4(){const H=hd().length;
V(`<h2>Dokumentasi Foto Absen</h2><p class="s">Semua foto yang diunggah aman tersimpan. Jika jam tidak terbaca otomatis, ketuk foto untuk atur jam atau status secara manual.</p>
<label class="dz"><input id="f" type="file" accept="image/*" multiple hidden><b>+</b>Pilih atau Seret Foto Absen<br><small>Format gambar JPG/PNG</small></label>
${P.length?`<div class="pts">${P.map(p=>`<div class="pt${ok(p)?'':' bad'}"><img data-pv="${p.id}" src="${p.d}"><span>${ok(p)?tm(p):'Atur'}</span></div>`).join('')}</div><p class="s" style="margin:12px 0 0">${P.length} foto tersimpan · ketuk foto untuk edit manual</p><button class="b o" data-clr>Hapus Semua Foto</button>`:''}
${nav.replace('Lanjut','Lihat Rekap Hasil')}`)}
const desc=(p,n)=>!p?n+': belum ada':ok(p)?n+': '+tm(p):n+': manual';
const fig=(p,l)=>`<figure class="t${p&&!ok(p)?' bad':''}">${p?`<img data-pv="${p.id}" src="${p.d}">`:'<div class="em">–</div>'}<figcaption>${l} ${p?tm(p):''}</figcaption></figure>`;
function day(d,r){const k=kind(d);
if(k!=='hadir')return`<div class="day mut"><div class="dh"><div class="dn"><b>${d}</b><small>${dow(d)}</small></div><div class="dm"><span class="pill">${LB[k]}</span></div></div></div>`;
const f=fin(d,r),nd=need(r),sg=sug(r);
return`<div class="day"><div class="dh"><div class="dn"><b>${d}</b><small>${dow(d)}</small></div><div class="dm">${f?`<span class="pill" style="--c:${SC[f]}">${SF[f]}</span>`:'<span class="pill w">Pilih Shift</span>'}</div></div>

y+=rh})});
