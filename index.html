<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Absensi</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<style>
:root{--bg:#f4f5f3;--card:#fff;--tx:#14181b;--mu:#6c7580;--ac:#0f766e;--bd:#e5e8ea;--wn:#fff4d6;--wt:#8a4b08;--bt:#fff;--sh:0 1px 2px rgba(0,0,0,.04),0 10px 28px rgba(0,0,0,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1113;--card:#171b1e;--tx:#eef1f3;--mu:#8e98a3;--ac:#2dd4bf;--bd:#262c31;--wn:#3a2c0e;--wt:#fcd34d;--bt:#04201c;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:24px;margin:6px 0 2px;letter-spacing:-.4px}h2{font-size:19px;margin:0 0 4px;letter-spacing:-.2px}
.s{color:var(--mu);margin:0 0 14px;font-size:14px}
#m{min-height:20px;font-size:13px;color:var(--ac);margin:0 0 8px}
.pg{display:flex;gap:6px;margin:10px 0 16px}.pg i{flex:1;height:4px;border-radius:4px;background:var(--bd);transition:.4s}.pg i.on{background:var(--ac)}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--sh);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
label{display:block;font-size:12px;color:var(--mu);margin:14px 0 5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
input:not([type=file]){width:100%;padding:13px;border:1.5px solid transparent;border-radius:13px;background:var(--bg);color:var(--tx);font:inherit;outline:0;transition:.2s}
input:focus{border-color:var(--ac)}input[type=file]{width:100%;font:inherit;color:var(--mu)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:var(--bt);font:600 15px inherit;font-family:inherit;margin-top:14px;cursor:pointer;transition:transform .12s,opacity .2s}
.b:active{transform:scale(.97)}.b.o{background:transparent;color:var(--tx);box-shadow:inset 0 0 0 1.5px var(--bd)}.b.r{background:#dc2626;color:#fff}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0;text-align:center}.dg small{color:var(--mu);font-size:11px;padding-bottom:2px}
.dg button{aspect-ratio:1;border:0;border-radius:12px;background:var(--bg);color:var(--tx);font:500 14px inherit;font-family:inherit;cursor:pointer;transition:.15s}
.dg button:active{transform:scale(.9)}.dg .on{background:var(--ac);color:var(--bt);font-weight:700}.dg .off{opacity:.35;text-decoration:line-through}
.dz{display:block;text-align:center;border:2px dashed var(--bd);border-radius:18px;padding:26px 12px;margin:0;cursor:pointer;color:var(--mu);font-size:14px;text-transform:none;letter-spacing:0;transition:.2s}
.dz:hover,.dz:active{border-color:var(--ac);color:var(--tx)}.dz b{display:block;font-size:30px;color:var(--ac)}
.pts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.pt{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;animation:rise .3s both}.pt img{width:100%;height:100%;object-fit:cover;cursor:pointer}
.pt span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:1px 6px;border-radius:8px}.pt.bad{outline:2px solid #f59e0b}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.st div{background:var(--bg);border-radius:14px;padding:10px 4px;text-align:center}.st b{display:block;font-size:20px}.st small{color:var(--mu);font-size:11px}
.bn{border-radius:14px;padding:11px 14px;margin-bottom:12px;background:var(--wn);color:var(--wt);font-weight:600;font-size:14px}.bn.ok{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.day{border-top:1px solid var(--bd);padding:12px 0;animation:rise .3s both}.day.mut{opacity:.6;padding:9px 0}
.dh{display:flex;align-items:center;gap:10px}.dn{width:44px}.dn b{font-size:20px;display:block;line-height:1}.dn small{color:var(--mu);font-size:12px}
.dm{margin-left:auto}.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--c,#888) 16%,transparent);color:var(--c,var(--mu))}.pill.w{--c:#d97706}
.ts{display:flex;gap:10px;margin:10px 0 0 54px;align-items:flex-end}
.t{margin:0;text-align:center;font-size:11px;color:var(--mu)}.t img,.t .em{width:62px;height:82px;object-fit:cover;border-radius:10px;display:grid;place-items:center;background:var(--bg);cursor:pointer}.t.bad img{outline:2px solid #f59e0b;outline-offset:1px}
.sw{margin-left:auto;color:var(--ac);font-size:13px;cursor:pointer;padding:6px}
.cf{margin:10px 0 0 54px;background:var(--wn);border-radius:14px;padding:11px 12px;font-size:13px;color:var(--wt)}.cf p{margin:0 0 8px}
.ch{display:flex;flex-wrap:wrap;gap:6px}.ch button{padding:8px 13px;border-radius:99px;border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);background:var(--card);color:var(--c);font:600 13px inherit;font-family:inherit;cursor:pointer;transition:.15s}
.ch button.on{background:var(--c);color:#fff;border-color:var(--c)}.ch button.sg{border-style:dashed}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:9;padding:20px;backdrop-filter:blur(6px)}
.lc{background:var(--card);border-radius:20px;padding:18px;width:100%;max-width:340px;text-align:center;animation:rise .25s}.lc img{max-width:100%;max-height:60vh;border-radius:12px}
.ph{position:relative;width:120px;height:150px;margin:0 auto 12px;border-radius:12px;overflow:hidden;background:var(--bg)}.ph img{width:100%;height:100%;object-fit:cover}
.ph:after{content:'';position:absolute;left:0;right:0;height:30px;background:linear-gradient(transparent,rgba(45,212,191,.7),transparent);animation:sc 1.1s ease-in-out infinite alternate}
@keyframes sc{from{top:-30px}to{top:100%}}
.bar{height:6px;border-radius:4px;background:var(--bd);overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.chip{display:inline-block;margin:3px;padding:3px 9px;border-radius:99px;background:var(--bg);font-size:12px;animation:pop .35s}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
</style></head><body><main>
<h1>Absensi</h1><div id="m"></div><div class="pg" id="pg"></div><div class="card" id="v"></div>
</main>
<div class="ov" id="ld" hidden><div class="lc"><div class="ph"><img id="lp" alt=""></div><b id="lt">Menyiapkan...</b><p class="s" id="lm" style="margin:6px 0 0"></p><div class="bar"><i id="lb"></i></div><div id="lc"></div></div></div>
<div class="ov" id="vw" data-cl hidden><div class="lc"><img id="li" alt=""><div class="g2"><button class="b o" data-cl>Tutup</button><button class="b r" id="lr">Hapus foto</button></div></div></div>
<script>
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'],LB={hadir:'Hadir',libur:'Libur',sakit:'Sakit',izin:'Izin',none:'-'};
const SF={op:'Opening',mid:'Middle',cl:'Closing',full:'Full Shift'},SC={op:'#f59e0b',mid:'#8b5cf6',cl:'#3b82f6',full:'#e11d48'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
let C={n:'',b:'',mo:iso(new Date()).slice(0,7),last:0,libur:[],sakit:[],izin:[],note:''},P=[],SW={},SH={},doc=null,st=0;
try{Object.assign(C,JSON.parse(localStorage.getItem('abs3')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('abs3',JSON.stringify(C))}catch(e){}};
const dim=()=>{const[Y,M]=C.mo.split('-').map(Number);return new Date(Y,M,0).getDate()};
const lastDef=()=>{const t=new Date();return C.mo===iso(t).slice(0,7)?t.getDate():dim()};
const V=h=>{$('v').innerHTML=h},msg=t=>{$('m').textContent=t};
const kind=d=>d>C.last?'none':C.libur.includes(d)?'libur':C.sakit.includes(d)?'sakit':C.izin.includes(d)?'izin':'hadir';
const hd=()=>{const a=[];for(let d=1;d<=C.last;d++)if(kind(d)==='hadir')a.push(d);return a};
const dow=d=>HR[new Date(+C.mo.slice(0,4),+C.mo.slice(5)-1,d).getDay()];
/* ---- jam & shift ---- */
const ok=p=>!!p&&p.src==='ocr';
const tm=p=>ok(p)?pad(new Date(p.t).getHours())+':'+pad(new Date(p.t).getMinutes()):'';
const mn=p=>{const d=new Date(p.t);return d.getHours()*60+d.getMinutes()};
const need=r=>!(r&&ok(r.i)&&ok(r.o));
function sug(r){if(!r||!ok(r.i))return null;const m=mn(r.i);let s=m<570?'op':m<690?'mid':'cl';
if(s==='op'&&ok(r.o)){const o=mn(r.o);if(o>=1410||o<60)s='full'}return s}
const fin=(d,r)=>SH[d]||(need(r)?null:sug(r));
/* ---- foto & OCR ---- */
const loadImg=f=>new Promise((res,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>res({i,u});i.onerror=no;i.src=u});
function shrink(i){const k=Math.min(1,700/Math.max(i.width,i.height)),w=Math.round(i.width*k),h=Math.round(i.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);return{d:c.toDataURL('image/jpeg',.65),w,h}}
const shrinkF=async f=>{const{i,u}=await loadImg(f),r=shrink(i);URL.revokeObjectURL(u);return r};
function badge(i){const W=300,H=Math.round(W*i.height/i.width),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(i,0,0,W,H);
const a=x.getImageData(Math.round(W*.03),Math.round(H*.73),Math.round(W*.27),Math.round(H*.06)).data;let b=0,o=0;
for(let k=0;k<a.length;k+=4){const r=a[k],g=a[k+1],l=a[k+2];if(l>200&&r<120&&g<150)b++;else if(r>220&&g>70&&g<160&&l<120)o++}
return b>o&&b>150?'in':o>b&&o>150?'out':null}
let TW=null,OE='',fi=0,ft=null;
const FUN=['Mencari angka jam di pojok foto…','Membaca tanggal dari cap Marki…','Membedakan masuk dan pulang…','Sebentar lagi, tinggal merapikan…'];
const ld=on=>{$('ld').hidden=!on;clearInterval(ft);if(on){fi=0;$('lm').textContent=FUN[0];$('lc').innerHTML='';$('lb').style.width='0';ft=setInterval(()=>{if(TW)$('lm').textContent=FUN[++fi%FUN.length]},2200)}};
/* Cap Marki: blok jam | hari+tanggal. Posisi dicari dari garis pemisah "|" (kolom putih paling tinggi), bukan koordinat tetap. */
function layout(i){const k=Math.min(1,1200/i.width),W=Math.round(i.width*k),H=Math.round(i.height*k),c=document.createElement('canvas');c.width=W;c.height=H;
const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(i,0,0,W,H);
const y0=Math.round(H*.79),h=Math.round(H*.08),w=Math.round(W*.6),a=x.getImageData(0,y0,w,h).data;
const m=(r,q)=>{const p=4*(r*w+q);return Math.min(a[p],a[p+1],a[p+2])>225?1:0};
const cs=new Array(w).fill(0);for(let r=0;r<h;r++)for(let q=0;q<w;q++)cs[q]+=m(r,q);
let d0=cs.findIndex(n=>n>=h*.64);if(d0<0)return null;let d1=d0;while(cs[d1+1]>=h*.64)d1++;
const bb=(xa,xb,ya,yb)=>{let l=1e9,r2=-1,t=1e9,b=-1;for(let r=ya;r<yb;r++)for(let q=xa;q<xb;q++)if(m(r,q)){l=Math.min(l,q);r2=Math.max(r2,q);t=Math.min(t,r);b=Math.max(b,r)}return r2<0?null:[l,t,r2+1,b+1]};
const T=bb(0,d0-6,0,h);if(!T)return null;
const rows=[];for(let r=0;r<h;r++){let n=0;for(let q=d1+8;q<w;q++)n+=m(r,q);rows.push(n>3)}
let e=h-1;while(e>0&&!rows[e])e--;let s=e;while(s>0&&rows[s-1])s--;
const D=bb(d1+8,w,s,e+1);if(!D)return null;
const P6=(b)=>[Math.max(0,b[0]-6),y0+Math.max(0,b[1]-6),b[2]+6,y0+Math.min(h,b[3]+6)];
return{c,t:P6(T),d:P6(D)}}
function cut(c,b,th){const[x0,y0,x1,y1]=b,k=60/(y1-y0),w=Math.max(8,Math.round((x1-x0)*k)),t=document.createElement('canvas');t.width=w+40;t.height=100;
const y=t.getContext('2d',{willReadFrequently:true});y.fillStyle='#fff';y.fillRect(0,0,w+40,100);y.drawImage(c,x0,y0,x1-x0,y1-y0,20,20,w,60);
const d=y.getImageData(20,20,w,60),a=d.data;for(let q=0;q<a.length;q+=4){const v=Math.min(a[q],a[q+1],a[q+2])>th?0:255;a[q]=a[q+1]=a[q+2]=v}y.putImageData(d,20,20);return t}
async function rec(c,wl){await TW.setParameters({tessedit_char_whitelist:wl});return(await TW.recognize(c)).data.text}
async function ocr(i){if(!window.Tesseract){OE='Pembaca jam tidak termuat, cek internet.';return null}
try{if(!TW){$('lt').textContent='Menyiapkan pembaca jam…';
TW=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.progress!=null&&!/recogni/.test(m.status))$('lm').textContent='Mengunduh pembaca: '+Math.round(m.progress*100)+'%'}});
await TW.setParameters({tessedit_pageseg_mode:'7'})}
const L=layout(i);if(!L)return null;const seen={};let first=null;
for(const th of[225,210,240]){
const tx=await rec(cut(L.c,L.t,th),'0123456789:'),dx=await rec(cut(L.c,L.d,th),'0123456789-'),
a=tx.match(/(\d{1,2})\s*:\s*(\d{2})/),b=dx.match(/(\d{2})\s*-\s*(\d{2})\s*-\s*(\d{4})/);
if(a&&b&&+a[1]<24&&+a[2]<60&&+b[2]>=1&&+b[2]<=12&&+b[1]>=1&&+b[1]<=31&&+b[3]>=2020&&+b[3]<=2040){
const t=new Date(+b[3],b[2]-1,+b[1],+a[1],+a[2]).getTime();seen[t]=(seen[t]||0)+1;if(first==null)first=t;if(seen[t]>=2)return t}}
return first}catch(e){OE='Pembaca jam gagal dimuat, cek internet.'}return null}
async function add(fs,sh){let k=0,n=0;OE='';ld(true);
for(const f of fs){$('lt').textContent='Foto '+(k+1)+' dari '+fs.length;let chip='';
try{const{i,u}=await loadImg(f),z=shrink(i);$('lp').src=z.d;let t=null,src='',role=null;
try{role=badge(i)}catch(e){}
try{t=await ocr(i);if(t)src='ocr'}catch(e){}
if(!t&&!sh&&f.lastModified){t=f.lastModified;src='file'}
URL.revokeObjectURL(u);
const p={id:Math.random().toString(36).slice(2,9),name:f.name||'',t,src,role,d:z.d,w:z.w,h:z.h};P.push(p);
if(src==='ocr'){n++;const d=new Date(t);chip='✓ '+tm(p)+' · '+d.getDate()+'/'+(d.getMonth()+1)+(role?' · '+(role==='in'?'Masuk':'Pulang'):'')}else chip='⚠ jam tidak terbaca'}catch(e){chip='⚠ foto gagal dibaca'}
k++;$('lb').style.width=Math.round(k/fs.length*100)+'%';
const c=$('lc');c.insertAdjacentHTML('afterbegin','<span class="chip">'+chip+'</span>');while(c.children.length>4)c.lastChild.remove()}
ld(false);msg(k+' foto ditambahkan, jam terbaca di '+n+'.'+(k>n?' Sisanya tetap disimpan, shift-nya nanti kamu pilih.':'')+(OE?' '+OE:''));if(st===4)s4()}
async function got(){if(!/shared=1/.test(location.search)||!window.caches)return;
const c=await caches.open('share'),ks=await c.keys(),fs=[];
for(const k of ks){const r=await c.match(k);fs.push(new File([await r.blob()],decodeURIComponent(r.headers.get('x-name')||'foto.jpg'),{type:'image/jpeg'}));await c.delete(k)}
history.replaceState(null,'','./');if(fs.length){await add(fs,true);msg(fs.length+' foto dari galeri sudah siap. Isi dulu langkah-langkah di bawah.')}}
/* ---- pasangkan foto ke hari ---- */
function assign(){const H=hd(),R={},rest=[];
P.forEach(p=>{let dt=p.t?new Date(p.t):null;
if(dt&&p.role==='out'&&dt.getHours()<6){const v=new Date(p.t-864e5);if(iso(v).slice(0,7)===C.mo)dt=v}
const d=dt&&iso(dt).slice(0,7)===C.mo?dt.getDate():0;
if(H.includes(d))(R[d]=R[d]||{a:[]}).a.push(p);else rest.push(p)});
for(const d in R){const a=R[d].a.sort((x,y)=>x.t-y.t),ins=a.filter(p=>p.role==='in'),outs=a.filter(p=>p.role==='out'),un=a.filter(p=>!p.role);
R[d]={i:ins[0]||un.shift()||null,o:outs[outs.length-1]||un.pop()||null}}
rest.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
const take=x=>{const k=rest.findIndex(p=>p.role!==x);return k<0?null:rest.splice(k,1)[0]};
H.forEach(d=>{const e=R[d]||(R[d]={i:null,o:null});if(!e.i)e.i=take('out');if(!e.o)e.o=take('in');if(SW[d])[e.i,e.o]=[e.o,e.i]});
return R}
/* ---- tampilan ---- */
const nav='<div class="g2"><button class="b o" data-bk>Kembali</button><button class="b" data-go>Lanjut</button></div>';
function s0(){V(`<h2>Data diri</h2><p class="s">Isi sekali, tersimpan otomatis.</p><label>Nama</label><input id="n" value="${esc(C.n)}" placeholder="Nama lengkap"><label>Cabang</label><input id="b" value="${esc(C.b)}" placeholder="Nama cabang"><div class="g2"><div><label>Bulan</label><input id="mo" type="month" value="${C.mo}"></div><div><label>Sampai tanggal</label><input id="la" type="number" min="1" max="31" value="${C.last||lastDef()}"></div></div><button class="b" data-go>Lanjut</button>`)}
function grid(){const key=['','libur','sakit','izin'][st],[Y,M]=C.mo.split('-').map(Number),off=new Date(Y,M-1,1).getDay();
let h=HR.map(x=>'<small>'+x+'</small>').join('')+'<span></span>'.repeat(off);
for(let d=1;d<=C.last;d++){const k=kind(d);h+=`<button data-d="${d}" class="${k===key?'on':k!=='hadir'?'off':''}">${d}</button>`}
$('gr').innerHTML=h}
function sx(){const t=[0,['Hari libur','Tanggal berapa saja kamu libur?',''],
['Sakit','Tanggal berapa saja kamu sakit?','<label>Foto surat dokter (wajib jika ada hari sakit)</label><input id="dk" type="file" accept="image/*">'+(doc?'<p class="s">✓ Foto surat sudah dipilih.</p>':'')],
['Izin','Tanggal berapa saja kamu izin?','<label>Keterangan izin (wajib jika ada hari izin)</label><input id="kt" value="'+esc(C.note)+'" placeholder="Alasan izin">']][st];
V(`<h2>${t[0]}</h2><p class="s">${t[1]} Ketuk tanggalnya, kalau tidak ada langsung lanjut.</p><div class="dg" id="gr"></div>${t[2]}${nav}`);grid()}
function s4(){const H=hd().length;
V(`<h2>Foto absen</h2><p class="s">Butuh ${2*H} foto (masuk &amp; pulang tiap hari hadir). Jam dibaca otomatis dari cap Marki. Foto yang tidak terbaca tetap dipakai, kamu tinggal pilih shift-nya.</p>
<label class="dz"><input id="f" type="file" accept="image/*" multiple hidden><b>+</b>Pilih foto dari galeri<br><small>atau tarik &amp; letakkan di sini</small></label>
${P.length?`<div class="pts">${P.map(p=>`<div class="pt${ok(p)?'':' bad'}"><img data-pv="${p.id}" src="${p.d}"><span>${ok(p)?tm(p):'?'}</span></div>`).join('')}</div><p class="s" style="margin:10px 0 0">${P.length} foto · ketuk untuk melihat/menghapus</p><button class="b o" data-clr>Kosongkan semua</button>`:''}
${nav.replace('Lanjut','Lihat hasil')}`)}
const desc=(p,n)=>!p?n+': foto belum ada':ok(p)?n+': terbaca jam '+tm(p):n+': jam tidak terbaca';
